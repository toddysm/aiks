[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiks"
version = "0.1.0"
description = "Reproducible AI workload foundations for Azure Kubernetes Service"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Toddy Mladenov", email = "toddysm@gmail.com" }]
dependencies = [
    "click>=8.1,<9",
    "pydantic>=2.11,<3",
    "PyYAML>=6,<7",
    "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
aiks = "aiks.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/aiks"]

[tool.hatch.build.targets.wheel.force-include]
"infrastructure/aks-automatic/bicep" = "aiks/infrastructure/aks-automatic/bicep"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=aiks --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["aiks"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aiks"]
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests"]
