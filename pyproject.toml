[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiks"
version = "0.1.0"
description = "Reproducible AI workload foundations for Azure Kubernetes Service"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Toddy Mladenov", email = "toddysm@gmail.com" }]
dependencies = [
    "click>=8.1,<9",
    "pydantic>=2.11,<3",
    "PyYAML>=6,<7",
    "rich>=13.9,<15",
]

[project.optional-dependencies]
readiness = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "prometheus-client>=0.21,<1",
    "azure-identity>=1.21,<2",
    "azure-keyvault-keys>=4.10,<5",
]
dev = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "bandit>=1.8,<2",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
aiks = "aiks.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/aiks"]

[tool.hatch.build.targets.wheel.force-include]
"infrastructure/aks-automatic/bicep" = "aiks/infrastructure/aks-automatic/bicep"
"infrastructure/aks-automatic/charts/readiness" = "aiks/infrastructure/aks-automatic/charts/readiness"
"infrastructure/aks-automatic/terraform/environment/main.tf" = "aiks/infrastructure/aks-automatic/terraform/environment/main.tf"
"infrastructure/aks-automatic/terraform/environment/versions.tf" = "aiks/infrastructure/aks-automatic/terraform/environment/versions.tf"
"infrastructure/aks-automatic/terraform/environment/backend.tf" = "aiks/infrastructure/aks-automatic/terraform/environment/backend.tf"
"infrastructure/aks-automatic/terraform/environment/network.tf" = "aiks/infrastructure/aks-automatic/terraform/environment/network.tf"
"infrastructure/aks-automatic/terraform/environment/security.tf" = "aiks/infrastructure/aks-automatic/terraform/environment/security.tf"
"infrastructure/aks-automatic/terraform/environment/monitoring.tf" = "aiks/infrastructure/aks-automatic/terraform/environment/monitoring.tf"
"infrastructure/aks-automatic/terraform/environment/alerts.tf" = "aiks/infrastructure/aks-automatic/terraform/environment/alerts.tf"
"infrastructure/aks-automatic/terraform/environment/outputs.tf" = "aiks/infrastructure/aks-automatic/terraform/environment/outputs.tf"
"infrastructure/aks-automatic/terraform/environment/.terraform.lock.hcl" = "aiks/infrastructure/aks-automatic/terraform/environment/.terraform.lock.hcl"
"infrastructure/aks-automatic/terraform/bootstrap/main.tf" = "aiks/infrastructure/aks-automatic/terraform/bootstrap/main.tf"
"infrastructure/aks-automatic/terraform/bootstrap/.terraform.lock.hcl" = "aiks/infrastructure/aks-automatic/terraform/bootstrap/.terraform.lock.hcl"
"infrastructure/aks-automatic/terraform/modules/cluster/main.tf" = "aiks/infrastructure/aks-automatic/terraform/modules/cluster/main.tf"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=aiks --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["aiks"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aiks"]
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests"]
