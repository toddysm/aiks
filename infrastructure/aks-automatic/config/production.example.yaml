apiVersion: aiks.io/v1alpha1
kind: AksAutomaticEnvironment
metadata:
  name: production
spec:
  environment: production
  location: westus3
  naming:
    prefix: aiks-prod
  identity:
    adminGroupObjectId: 22222222-2222-4222-8222-222222222222
  network:
    vnetCidr: 10.30.0.0/16
    apiServerSubnetCidr: 10.30.0.0/28
    systemNodeSubnetCidr: 10.30.0.64/26
    userNodeSubnetCidr: 10.30.1.0/24
    privateEndpointSubnetCidr: 10.30.2.0/27
    podCidr: 10.245.0.0/16
    serviceCidr: 10.1.0.0/16
    dnsServiceIp: 10.1.0.10
    privateCluster: true
    authorizedIpRanges: []
    paasAllowedIpRanges: []
  observability:
    containerInsights: true
    managedPrometheus: true
    managedGrafana: true
    logRetentionDays: 90
    actionGroupResourceIds: []
    actionGroupReceivers:
      - name: platform-email
        emailAddress: platform@example.com
  terraform:
    stateResourceGroup: aiks-tfstate-prod
    stateStorageAccount: staiksprod0001
    stateContainer: tfstate
  local:
    kindClusterName: aiks-readiness
  tags:
    application: aiks
    environment: production
