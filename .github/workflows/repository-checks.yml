name: Repository quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Documentation, workflow and secret gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Python validation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install pinned static tools
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt -o actionlint.checksums
          hash="$(awk '$2 == "actionlint_1.7.12_linux_amd64.tar.gz" {print $1}' actionlint.checksums)"
          printf '%s  %s\n' "$hash" actionlint.tar.gz | sha256sum --check --status
          tar -xzf actionlint.tar.gz actionlint
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o gitleaks.checksums
          hash="$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' gitleaks.checksums)"
          printf '%s  %s\n' "$hash" gitleaks.tar.gz | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
          curl -fsSL --retry 3 https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz -o lychee.tar.gz
          curl -fsSL --retry 3 https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz.sha256 -o lychee.checksums
          hash="$(awk 'NR == 1 {print $1}' lychee.checksums)"
          printf '%s  %s\n' "$hash" lychee.tar.gz | sha256sum --check --status
          tar -xzf lychee.tar.gz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate structured data and workflow policy
        run: python scripts/check_repository.py
      - name: Lint workflow semantics
        run: actionlint -color
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.20.0
      - name: Check tracked local links and fragments
        shell: bash
        run: git ls-files -z '*.md' | xargs -0 lychee --offline --include-fragments --no-progress
      - name: Scan commit history for secrets
        run: gitleaks git --redact --no-banner --log-opts="--all"
      - name: Verify secret scanner rejects a synthetic credential
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/secret-fixture"
          mkdir -p "$fixture"
          printf 'github_token = "%s%s%s"\n' ghp_ A3mN8vQ2rX7sP5kL9t Z6cD4fG1hJ0bW3yU5e > "$fixture/negative.txt"
          result=0
          gitleaks dir --redact --no-banner "$fixture" || result=$?
          test "$result" = 1