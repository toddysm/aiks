name: Python quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff lint
        run: ruff check src tests

      - name: Check Ruff formatting
        run: ruff format --check src tests

      - name: Run strict type checks
        run: mypy src

      - name: Run Bandit security checks
        run: bandit -q -r src

      - name: Audit dependencies
        run: pip-audit

      - name: Check generated JSON Schema
        shell: bash
        run: |
          schema_output="$(mktemp)"
          aiks config schema --output "$schema_output"
          diff --unified infrastructure/aks-automatic/config/schema.json "$schema_output"

      - name: Check zsh completion generation
        shell: bash
        run: _AIKS_COMPLETE=zsh_source aiks | grep -q '#compdef aiks'
