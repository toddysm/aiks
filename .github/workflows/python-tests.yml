name: Python quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install pinned Bicep compiler
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/Azure/bicep/releases/download/v0.46.1/bicep-linux-x64 \
            --output "$RUNNER_TEMP/bicep"
          printf '%s  %s\n' \
            3e011d629ea4311b7a7dd8f0040ab2b1a072ea4ff5d02cb75e0e55a9a6703fb9 \
            "$RUNNER_TEMP/bicep" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/bicep"
          "$RUNNER_TEMP/bicep" --version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check Bicep formatting
        shell: bash
        run: |
          find infrastructure/aks-automatic/bicep -name '*.bicep' -exec bicep format {} \;
          git diff --exit-code -- infrastructure/aks-automatic/bicep

      - name: Run tests
        env:
          AIKS_REQUIRE_BICEP: "1"
        run: python -m pytest

      - name: Run Ruff lint
        run: ruff check src tests

      - name: Check Ruff formatting
        run: ruff format --check src tests

      - name: Run strict type checks
        run: mypy src

      - name: Run Bandit security checks
        run: bandit -q -r src

      - name: Audit dependencies
        run: pip-audit

      - name: Check generated JSON Schema
        shell: bash
        run: |
          schema_output="$(mktemp)"
          aiks config schema --output "$schema_output"
          diff --unified infrastructure/aks-automatic/config/schema.json "$schema_output"

      - name: Check zsh completion generation
        shell: bash
        run: _AIKS_COMPLETE=zsh_source aiks | grep -q '#compdef aiks'
